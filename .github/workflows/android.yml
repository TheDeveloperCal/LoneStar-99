name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Android NDK
        run: sdkmanager "ndk;27.1.12297006" "platforms;android-36"
      - name: Verify clean-room firmware and Rust gameplay
        run: |
          ./tools/build-console-grom.sh
          cargo run --locked --offline --manifest-path tools/texas-trail/Cargo.toml --bin build_cart
          cargo test --locked --offline --manifest-path app/src/main/rust/libre99-core/Cargo.toml
          cargo test --locked --offline --manifest-path tools/texas-trail/Cargo.toml
          cargo test --release --locked --offline --manifest-path tools/texas-trail/Cargo.toml
          cargo clippy --locked --offline --manifest-path app/src/main/rust/libre99-core/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked --offline --manifest-path tools/texas-trail/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked --offline --manifest-path tools/firmware-toolchain/Cargo.toml --all-targets -- -D warnings
      - name: Android unit tests, lint, and builds
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease
